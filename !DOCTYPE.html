<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon planning de stages</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--txt:#1b2733;--mut:#66788a;--line:#e1e7ee;--acc:#0b6e99;--accbg:#e4f2f8}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--txt:#e8eef3;--mut:#93a4b4;--line:#2a3743;--acc:#5bbbe0;--accbg:#1b3442}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:620px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 18px;font-size:.95rem}
input{width:100%;padding:14px 16px;font-size:1.05rem;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--txt)}
input:focus{outline:none;border-color:var(--acc)}
.list{margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--txt);font:inherit;cursor:pointer}
.list button:last-child{border-bottom:0}
.list button:hover,.list button:focus{background:var(--accbg)}
.list small{color:var(--mut)}
.msg{margin-top:12px;color:var(--mut)}
.head{margin:22px 0 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;flex-wrap:wrap}
.head h2{margin:0;font-size:1.2rem}
.head span{color:var(--mut);font-size:.92rem}
.day{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.date{min-width:58px;text-align:center;border-right:1px solid var(--line);padding-right:12px}
.date b{display:block;font-size:1.5rem;line-height:1.1;color:var(--acc)}
.date span{font-size:.78rem;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.what b{display:block}
.what span{color:var(--mut);font-size:.92rem}
.past{opacity:.5}
.tag{display:inline-block;margin-left:6px;font-size:.72rem;padding:1px 7px;border-radius:99px;background:var(--accbg);color:var(--acc);vertical-align:middle}
.actions{margin-top:14px;display:flex;gap:8px}
.actions button{padding:10px 14px;border-radius:10px;border:1.5px solid var(--acc);background:none;color:var(--acc);font:inherit;cursor:pointer}
.note{margin-top:16px;font-size:.85rem;color:var(--mut)}
</style>
</head>
<body>

</main>

const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const JOURS=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const STU=DATA.S.map(([n,nom,pre,mat])=>({n,nom,pre,mat,words:norm(nom+" "+pre).split(" ")}));
const grp=n=>n<=75?"A":n<=150?"B":n<=225?"C":"D";
const parse=iso=>{const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d)};
const fmt=d=>JOURS[d.getDay()]+" "+d.getDate()+(d.getDate()===1?"er":"")+" "+MOIS[d.getMonth()]+" "+d.getFullYear();
const $=id=>document.getElementById(id), out=$("out");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function planning(n){
  const rows=[];
  for(const r of DATA.R) if(n>=r.lo&&n<=r.hi) for(const d of r.d) rows.push({d,r});
  return rows.sort((a,b)=>a.d.localeCompare(b.d));
}
function search(q){
  const t=norm(q).split(" ").filter(Boolean);
  if(!t.length) return [];
  return STU.filter(s=>t.every(x=>s.words.some(w=>w.startsWith(x))));
}
function show(s){
  const rows=planning(s.n), today=new Date(); today.setHours(0,0,0,0);
  let deduced=false, text=s.nom+" "+s.pre+" – Groupe "+grp(s.n)+"\n";
  let html=`<div class="head"><h2>${esc(s.nom)} ${esc(s.pre)}</h2><span>Groupe ${grp(s.n)} · ${rows.length} jours de stage</span></div>`;
  for(const {d,r} of rows){
    const dt=parse(d), lieu=r.l?` — ${r.l}`:"";
    if(r.q) deduced=true;
    const detail=r.h?r.h:(r.m.startsWith("Polyclinique")?"Module d’épidémiologie":"");
    html+=`<div class="day${dt<today?" past":""}"><div class="date"><b>${dt.getDate()}</b><span>${MOIS[dt.getMonth()].slice(0,4)}${MOIS[dt.getMonth()].length>4?".":""}</span></div>
      <div class="what"><b>${esc(r.m)}${lieu}${r.q?'<span class="tag">*</span>':""}</b><span>${JOURS[dt.getDay()]} ${dt.getDate()} ${MOIS[dt.getMonth()]}${detail?" · "+esc(detail):""}</span></div></div>`;
    text+=`• ${fmt(dt)} : ${r.m}${lieu}${r.h?" ("+r.h+")":""}\n`;
  }
  html+=`<div class="actions"><button id="cp">Copier mon planning</button><button onclick="window.print()">Imprimer</button></div>`;
  if(deduced) html+=`<p class="note">* Le lieu (service ou annexe) n’était pas indiqué dans le document d’origine ; il a été déduit du planning. À confirmer auprès de l’administration.</p>`;
  html+=`<p class="note">Vérifiez toujours avec l’affichage officiel de la faculté.</p>`;
  out.innerHTML=html;
  $("cp").onclick=()=>{navigator.clipboard.writeText(text).then(()=>{$("cp").textContent="Copié ✓"}).catch(()=>{})};
}
$("q").addEventListener("input",e=>{
  const q=e.target.value; if(!norm(q)){out.innerHTML="";return}
  const res=search(q);
  if(!res.length){out.innerHTML=`<p class="msg">Aucun étudiant trouvé. Vérifiez l’orthographe de votre nom.</p>`;return}
  if(res.length===1){show(res[0]);return}
  const dup=new Set(), seen={}; res.forEach(s=>{const k=s.nom+"|"+s.pre; if(seen[k]) dup.add(k); seen[k]=1});
  const shown=res.slice(0,10);
  out.innerHTML=`<div class="list">`+shown.map(s=>`<button data-n="${s.n}"><span>${esc(s.nom)} ${esc(s.pre)}</span>${dup.has(s.nom+"|"+s.pre)?`<small>Matricule ${esc(s.mat)}</small>`:""}</button>`).join("")+`</div>`
   +(res.length>10?`<p class="msg">${res.length} résultats — précisez votre nom ou prénom.</p>`:`<p class="msg">Choisissez votre nom dans la liste.</p>`);
  out.querySelectorAll("button").forEach(b=>b.onclick=()=>show(STU.find(s=>s.n==b.dataset.n)));
});
